scene.add(new THREE.HemisphereLight(0xffffff,0x6b7a55,1.2));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(900,1600,700);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=50;sun.shadow.camera.far=5000;sun.shadow.camera.left=-2200;sun.shadow.camera.right=2200;sun.shadow.camera.top=2200;sun.shadow.camera.bottom=-2200;scene.add(sun);

const roadMat=new THREE.MeshStandardMaterial({color:0x918777,roughness:.95});for(let i=-5;i<=5;i++){let a=new THREE.Mesh(new THREE.BoxGeometry(12000,2,90),roadMat);a.position.set(0,1,i*760);a.receiveShadow=true;scene.add(a);let b=new THREE.Mesh(new THREE.BoxGeometry(90,2,12000),roadMat);b.position.set(i*760,1,0);b.receiveShadow=true;scene.add(b)}
const buildings=[],solids=[];const palettes=[{wall:0xb56d58,roof:0x6f3028,trim:0x7d463a},{wall:0xd5b58e,roof:0x8b4337,trim:0x725039},{wall:0xc7b6a4,roof:0x62584f,trim:0x86766a},{wall:0xdcc9aa,roof:0x5f332b,trim:0x61432f}];

for(let gx=-5;gx<=5;gx++){for(let gz=-5;gz<=5;gz++){if(gx===0&&gz===0)continue;if(gx===1&&gz===1)continue;if(Math.abs(gx)%3===0||Math.abs(gz)%3===0)continue;if(Math.random()<.12)continue;const x=gx*760+(Math.random()*180-90),z=gz*760+(Math.random()*180-90),w=190+Math.random()*130,d=190+Math.random()*130,centerBoost=Math.max(0,1-Math.hypot(gx,gz)/7),h=220+Math.random()*360+centerBoost*420,pal=palettes[Math.floor(Math.random()*palettes.length)];createBuilding(x,z,w,d,h,pal)}}
const wallMat=new THREE.MeshStandardMaterial({color:0xbdb7ad,roughness:.9});const wallRadius=4700;for(let i=0;i<96;i++){const a=i/96*Math.PI*2,x=Math.sin(a)*wallRadius,z=Math.cos(a)*wallRadius;const wall=new THREE.Mesh(new THREE.BoxGeometry(230,820,120),wallMat);wall.position.set(x,410,z);wall.rotation.y=a;wall.castShadow=wall.receiveShadow=true;scene.add(wall);solids.push({x:x-115,z:z-60,w:230,d:120,h:820})}
const goalX=3100,goalZ=3250;const goal=new THREE.Group(),gateMat=new THREE.MeshStandardMaterial({color:0x35ff4a,emissive:0x0a4a0a,roughness:.4});const p1=new THREE.Mesh(new THREE.BoxGeometry(35,360,35),gateMat);p1.position.set(-100,180,0);const p2=p1.clone();p2.position.x=100;const top=new THREE.Mesh(new THREE.BoxGeometry(235,35,35),gateMat);top.position.set(0,360,0);goal.add(p1,p2,top);goal.position.set(goalX,0,goalZ);scene.add(goal);

// Humanoid v3:
// - レスリングの構えを参考にした前傾姿勢

function makeCapsule(radius,length,mat){
  const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(radius,length,8,14),mat);
  mesh.castShadow=true;mesh.receiveShadow=true;return mesh;
}
function makeBox(w,h,d,mat){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.castShadow=true;mesh.receiveShadow=true;return mesh;
}
function makeSphere(r,mat){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);
  mesh.castShadow=true;mesh.receiveShadow=true;return mesh;
}

// 全身基準:
// 足裏 -78 / 頭頂 約118 → 身長約196
// 脚: 股関節 -3 から足裏 -78 = 約75、さらに骨盤周辺込みで約88〜90 → 約45%
const rig={
  root:playerGroup,
  pelvis:new THREE.Group(),
  spine:new THREE.Group(),
  chest:new THREE.Group(),
  neck:new THREE.Group(),
  head:new THREE.Group(),
  lShoulder:new THREE.Group(),rShoulder:new THREE.Group(),
  lElbow:new THREE.Group(),rElbow:new THREE.Group(),
  lWrist:new THREE.Group(),rWrist:new THREE.Group(),
  lHip:new THREE.Group(),rHip:new THREE.Group(),
  lKnee:new THREE.Group(),rKnee:new THREE.Group(),
  lAnkle:new THREE.Group(),rAnkle:new THREE.Group()
};

playerGroup.add(rig.pelvis);
rig.pelvis.add(rig.spine,rig.lHip,rig.rHip);
rig.spine.add(rig.chest);
rig.chest.add(rig.neck,rig.lShoulder,rig.rShoulder);
rig.neck.add(rig.head);

const parts={};

// 高腰: 骨盤を高め、胴はやや短く締める
parts.pelvis=makeBox(38,18,24,gearMat);parts.pelvis.position.set(0,0,0);rig.pelvis.add(parts.pelvis);

// ---- External GLB character ----
// index.html と同じ階層に peoplemodel.glb を置く。
let externalCharacter = null;
let externalMixer = null;
let externalReady = false;
let externalLoadFailed = false;

playerGroup.visible = true;

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  "peoplemodel.glb",
  (gltf) => {
    // GLBは原点・サイズがバラバラなので、必ずラッパーで正規化する
    const rawModel = gltf.scene;
    rawModel.traverse((obj) => {
      if(obj.isMesh){
        obj.castShadow = true;
        obj.receiveShadow = true;
        obj.frustumCulled = false;
      }
    });

    externalCharacter = new THREE.Group();
    externalCharacter.add(rawModel);
    scene.add(externalCharacter);

    // まずモデルの境界を測る
    const box = new THREE.Box3().setFromObject(rawModel);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);

    // 目標身長。今のゲーム内アバターに合わせる
    const targetHeight = 170;
    const modelHeight = Math.max(size.y, 0.0001);
    const scale = targetHeight / modelHeight;

    // モデル中心をX/Z中央へ、足元をY=0へ合わせる
    rawModel.position.x -= center.x;
    rawModel.position.z -= center.z;
    rawModel.position.y -= box.min.y;

    rawModel.scale.setScalar(scale);

    // Mixamo/Sketchfabで向きが違う場合に備えた初期補正
    rawModel.rotation.y = Math.PI;

    if(gltf.animations && gltf.animations.length > 0){
      externalMixer = new THREE.AnimationMixer(rawModel);
      const action = externalMixer.clipAction(gltf.animations[0]);
      action.play();
    }

    externalReady = true;
    playerGroup.visible = false;
    if(typeof loadStatus !== 'undefined' && loadStatus) loadStatus.style.display = "none";
  },
  undefined,
  (err) => {
    console.warn("peoplemodel.glb load failed:", err);
    externalLoadFailed = true;
    playerGroup.visible = true;
    if(typeof loadStatus !== 'undefined' && loadStatus) loadStatus.textContent = "peoplemodel.glbを読み込めませんでした。\nファイル名と配置を確認してください。";
  }
);

function updateExternalCharacter(dt){
  if(!externalCharacter) return;

  externalCharacter.position.copy(player.pos);

  // 足元をプレイヤー接地点へ合わせる
  externalCharacter.position.y = player.pos.y - 58;

  // 向き補正。逆向きなら + Math.PI を外す
  externalCharacter.rotation.y = player.yaw + Math.PI;

  if(externalMixer){
    externalMixer.update(dt);
  }
}

const input={up:false,down:false,left:false,right:false,reel:false,release:false};let autoMode=false;const player={pos:new THREE.Vector3(0,60,0),vel:new THREE.Vector3(0,0,0),yaw:0,pitch:0,grounded:false,wires:{left:{hooked:false,point:new THREE.Vector3(),length:0},right:{hooked:false,point:new THREE.Vector3(),length:0}}};let startTime=performance.now(),clearTime=null,cleared=false;
function reset(){player.pos.set(0,80,0);player.vel.set(0,0,0);player.yaw=0;player.pitch=0;player.wires.left.hooked=false;player.wires.right.hooked=false;startTime=performance.now();clearTime=null;cleared=false;document.getElementById('clearText').style.display='none'}function respawn(){player.pos.set(0,360,0);player.vel.set(0,0,0);player.wires.left.hooked=false;player.wires.right.hooked=false}document.getElementById('resetBtn').onclick=reset;document.getElementById('respawnBtn').onclick=respawn;document.getElementById('modeBtn').onclick=()=>{autoMode=!autoMode;document.body.classList.toggle('auto',autoMode);document.getElementById('modeBtn').textContent=autoMode?'AUTO':'MANUAL'};
function bind(id,key){const el=document.getElementById(id),on=e=>{e.preventDefault();input[key]=true},off=e=>{e.preventDefault();input[key]=false};['pointerdown','touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,on,{passive:false}));['pointerup','pointercancel','touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,off,{passive:false}))}['up','down','left','right','reel','release'].forEach(v=>bind(v,v));
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')input.up=true;if(e.key==='ArrowDown')input.down=true;if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key.toLowerCase()==='a')input.reel=true;if(e.key.toLowerCase()==='b')input.release=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowUp')input.up=false;if(e.key==='ArrowDown')input.down=false;if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false;if(e.key.toLowerCase()==='a')input.reel=false;if(e.key.toLowerCase()==='b')input.release=false});
function forwardVector(){return new THREE.Vector3(Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),Math.cos(player.yaw)*Math.cos(player.pitch)).normalize()}
function shootWire(side,sx,sy){const ndc=new THREE.Vector2((sx/innerWidth)*2-1,-(sy/innerHeight)*2+1);const raycaster=new THREE.Raycaster();raycaster.setFromCamera(ndc,camera);raycaster.far=3200;const objects=[];scene.traverse(o=>{if(o.isMesh&&o!==ground&&o.parent!==playerGroup)objects.push(o)});const hits=raycaster.intersectObjects(objects,true);let hit=hits.find(h=>h.distance>70);if(!hit){const gh=raycaster.intersectObject(ground);hit=gh.find(h=>h.distance>70)}if(!hit)return;const f=forwardVector(),toHit=hit.point.clone().sub(player.pos).normalize();if(f.dot(toHit)<.06)return;const w=player.wires[side];w.hooked=true;w.point.copy(hit.point);w.length=player.pos.distanceTo(hit.point)}
document.getElementById('tapLayer').addEventListener('pointerdown',e=>{if(e.target.id!=='tapLayer')return;e.preventDefault();shootWire(e.clientX<innerWidth/2?'left':'right',e.clientX,e.clientY)},{passive:false});
function collide(){const radius=28;player.grounded=false;if(player.pos.y<60){player.pos.y=60;if(player.vel.y<0)player.vel.y=0;player.grounded=true}for(const b of solids){if(player.pos.y>b.h+80)continue;const insideX=player.pos.x>b.x-radius&&player.pos.x<b.x+b.w+radius,insideZ=player.pos.z>b.z-radius&&player.pos.z<b.z+b.d+radius;if(insideX&&insideZ&&player.pos.y<b.h+70){const left=Math.abs(player.pos.x-(b.x-radius)),right=Math.abs(player.pos.x-(b.x+b.w+radius)),front=Math.abs(player.pos.z-(b.z-radius)),back=Math.abs(player.pos.z-(b.z+b.d+radius)),min=Math.min(left,right,front,back);if(min===left){player.pos.x=b.x-radius;player.vel.x*=.25}else if(min===right){player.pos.x=b.x+b.w+radius;player.vel.x*=.25}else if(min===front){player.pos.z=b.z-radius;player.vel.z*=.25}else{player.pos.z=b.z+b.d+radius;player.vel.z*=.25}}if(player.pos.x>b.x-radius&&player.pos.x<b.x+b.w+radius&&player.pos.z>b.z-radius&&player.pos.z<b.z+b.d+radius&&player.pos.y<b.h+60&&player.pos.y>b.h-30&&player.vel.y<=0){player.pos.y=b.h+60;player.vel.y=0;player.grounded=true}}}
function applyWire(w,dt){if(!w.hooked)return;const toPlayer=player.pos.clone().sub(w.point),dist=toPlayer.length();if(dist<1)return;const n=toPlayer.clone().normalize();if(input.reel){w.length=Math.max(90,w.length-(8+Math.min(22,dist*.018)))}else{w.length=Math.min(w.length+.5,dist+26)}if(dist>w.length){const excess=dist-w.length;player.pos.addScaledVector(n,-excess);const radial=player.vel.dot(n);if(radial>0)player.vel.addScaledVector(n,-radial);if(input.reel){player.vel.addScaledVector(n,-(14+Math.min(30,excess*.08))*dt*60)}}}
function updateCamera(dt){if(autoMode){const dx=goalX-player.pos.x,dz=goalZ-player.pos.z,targetYaw=Math.atan2(dx,dz);let diff=targetYaw-player.yaw;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;player.yaw+=diff*.05;const dist=Math.hypot(dx,dz),targetPitch=THREE.MathUtils.clamp(Math.atan2(160-player.pos.y,dist)+.05,-.55,.55);player.pitch+=(targetPitch-player.pitch)*.04}else{if(input.left)player.yaw+=1.8*dt;if(input.right)player.yaw-=1.8*dt;if(input.up)player.pitch+=1.2*dt;if(input.down)player.pitch-=1.2*dt;player.pitch=THREE.MathUtils.clamp(player.pitch,-1.2,1.2)}const f=forwardVector(),target=player.pos.clone().add(new THREE.Vector3(0,40,0)),camPos=target.clone().addScaledVector(f,-230).add(new THREE.Vector3(0,80,0));camera.position.lerp(camPos,.22);camera.lookAt(target.clone().addScaledVector(f,180))}
function updateAvatar(){
  playerGroup.position.copy(player.pos);
  playerGroup.rotation.y=player.yaw+Math.PI;
// レスリング構えの前傾を全身で表現するため、骨盤起点でキャラ全体を前に倒す
playerGroup.rotation.x=0.22;

  const hasWire=player.wires.left.hooked||player.wires.right.hooked;
  const reeling=input.reel&&hasWire;
  const falling=!player.grounded&&player.vel.y<-1.0;
  const rising=!player.grounded&&player.vel.y>1.0;
  const speed=player.vel.length();
  const time=performance.now()*0.006;

  // Base: wrestling stance.
  // 高腰、股関節から前傾、膝は深く落としすぎない。
  const target={
    spineX:.18,chestX:.24,chestZ:0,pelvisZ:0,headX:-.10,
    lArmX:.70,rArmX:.70,lArmZ:-.32,rArmZ:.32,
    lElbowX:-.28,rElbowX:-.28,lWristX:.06,rWristX:.06,
    lLegX:-.18,rLegX:-.18,lLegZ:.12,rLegZ:-.12,
    lKneeX:.46,rKneeX:.46,lAnkleX:-.10,rAnkleX:-.10
  };

  if(player.grounded){
    // 構え中の小さな重心移動
    target.chestZ=Math.sin(time)*.018;
    target.pelvisZ=-Math.sin(time)*.010;
    target.lArmX+=Math.sin(time)*.035;
    target.rArmX-=Math.sin(time)*.035;
  }

  if(reeling){
    // 巻き取り: レスリング構えからさらに前傾。
    // 肘は体側へ引き、肩は前方、腰は高く残す。
    target.spineX=.28;
    target.chestX=.38;
    target.headX=-.14;
    target.lArmX=1.05;
    target.rArmX=1.05;
    target.lArmZ=-.34;
    target.rArmZ=.34;
    target.lElbowX=-.52;
    target.rElbowX=-.52;
    target.lWristX=.10;
    target.rWristX=.10;
    target.lLegX=-.22;
    target.rLegX=-.18;
    target.lLegZ=.16;
    target.rLegZ=-.16;
    target.lKneeX=.54;
    target.rKneeX=.50;
    target.lAnkleX=-.14;
    target.rAnkleX=-.14;
  }else if(falling){
    // 落下: 前傾は残しつつ、腕でバランスを取る。
    target.spineX=.10;
    target.chestX=.16;
    target.headX=-.06;
    target.lArmX=.56;
    target.rArmX=.56;
    target.lArmZ=-.68;
    target.rArmZ=.68;
    target.lElbowX=-.08;
    target.rElbowX=-.08;
    target.lLegX=-.24;
    target.rLegX=-.26;
    target.lLegZ=.24;
    target.rLegZ=-.24;
    target.lKneeX=.42;
    target.rKneeX=.38;
  }else if(rising){
    // 上昇: 構えから脚をやや伸ばす。肩は高めを維持。
    target.spineX=.08;
    target.chestX=.12;
    target.headX=-.04;
    target.lArmX=.82;
    target.rArmX=.82;
    target.lArmZ=-.30;
    target.rArmZ=.30;
    target.lElbowX=-.06;
    target.rElbowX=-.06;
    target.lLegX=-.32;
    target.rLegX=-.24;
    target.lKneeX=.34;
    target.rKneeX=.30;
  }else if(speed>12&&!player.grounded){
    // 高速滑空: レスリング前傾を空中姿勢に変換。
    target.spineX=.18;
    target.chestX=.26;
    target.lArmX=.44;
    target.rArmX=.44;
    target.lArmZ=-.55;
    target.rArmZ=.55;
    target.lElbowX=-.06;
    target.rElbowX=-.06;
    target.lLegX=-.18;
    target.rLegX=-.20;
    target.lKneeX=.28;
    target.rKneeX=.26;
  }

  smoothAvatar(target,reeling?.22:.15);

  rig.spine.rotation.x=avatarAnim.spineX;
  rig.chest.rotation.x=avatarAnim.chestX;
  rig.chest.rotation.z=avatarAnim.chestZ;
  rig.pelvis.rotation.z=avatarAnim.pelvisZ;
  rig.head.rotation.x=avatarAnim.headX;

  rig.lShoulder.rotation.set(avatarAnim.lArmX,0,avatarAnim.lArmZ);
  rig.rShoulder.rotation.set(avatarAnim.rArmX,0,avatarAnim.rArmZ);
  rig.lElbow.rotation.x=avatarAnim.lElbowX;
  rig.rElbow.rotation.x=avatarAnim.rElbowX;
  rig.lWrist.rotation.x=avatarAnim.lWristX;
  rig.rWrist.rotation.x=avatarAnim.rWristX;

  rig.lHip.rotation.set(avatarAnim.lLegX,0,avatarAnim.lLegZ);
  rig.rHip.rotation.set(avatarAnim.rLegX,0,avatarAnim.rLegZ);
  rig.lKnee.rotation.x=avatarAnim.lKneeX;
  rig.rKnee.rotation.x=avatarAnim.rKneeX;
  rig.lAnkle.rotation.x=avatarAnim.lAnkleX;
  rig.rAnkle.rotation.x=avatarAnim.rAnkleX;
}
function updateWireLines(){function setLine(line,w,offset){if(!w.hooked){line.visible=false;return}line.visible=true;line.geometry.dispose();line.geometry=new THREE.BufferGeometry().setFromPoints([player.pos.clone().add(offset),w.point])}setLine(leftLine,player.wires.left,new THREE.Vector3(-20,55,0));setLine(rightLine,player.wires.right,new THREE.Vector3(20,55,0))}
function getRank(sec){if(sec<=18)return'S';if(sec<=30)return'A';if(sec<=45)return'B';if(sec<=60)return'C';return'D'}function updateUI(){const elapsed=clearTime??(performance.now()-startTime)/1000;timeText.textContent='T:'+elapsed.toFixed(2);heightText.textContent='H:'+Math.floor(player.pos.y);speedText.textContent='S:'+Math.floor(player.vel.length()*10);wireText.textContent='L:'+(player.wires.left.hooked?'ON':'OFF')+' / R:'+(player.wires.right.hooked?'ON':'OFF');stateText.textContent=(externalReady?'MODEL':'FALLBACK')+' / '+(player.grounded?'GROUND':'AIR')}
function checkGoal(){if(cleared)return;const d=Math.hypot(player.pos.x-goalX,player.pos.z-goalZ);if(d<160&&player.pos.y<430){cleared=true;clearTime=(performance.now()-startTime)/1000;rankText.textContent='TIME '+clearTime.toFixed(2)+' / RANK '+getRank(clearTime);clearText.style.display='block'}}
function animate(){const dt=Math.min(.033,clock.getDelta());if(input.release){player.wires.left.hooked=false;player.wires.right.hooked=false}player.vel.y-=14*dt;applyWire(player.wires.left,dt);applyWire(player.wires.right,dt);player.pos.addScaledVector(player.vel,dt*60);collide();player.vel.multiplyScalar(.993);player.vel.y*=.998;updateCamera(dt);updateAvatar();updateExternalCharacter(dt);updateWireLines();checkGoal();updateUI();renderer.render(scene,camera);requestAnimationFrame(animate)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();reset();
setTimeout(()=>{ if(loadStatus && !externalReady && !externalLoadFailed) loadStatus.textContent="3Dは起動済み。モデル読込中..."; }, 1200);
animate();document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
