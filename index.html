<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>立体機動装置 Prototype 3D版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#000}
#tapLayer{position:fixed;inset:0;z-index:5;background:transparent;touch-action:none}.hud{position:fixed;top:14px;right:14px;z-index:20;background:rgba(0,0,0,.42);color:#fff;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.55;text-align:right;backdrop-filter:blur(5px);min-width:120px}.system{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:8px}.system button,.mode button{border:none;background:rgba(255,255,255,.82);border-radius:12px;padding:8px 11px;font-weight:700;font-size:13px;box-shadow:0 8px 18px rgba(0,0,0,.16)}.mode{position:fixed;top:14px;left:14px;z-index:25}.ui{position:fixed;left:8vw;right:8vw;bottom:34px;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.ui>*{pointer-events:auto}.dpad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:8px}.btn{border:none;background:rgba(255,255,255,.70);color:#111;border-radius:16px;font-weight:800;font-size:22px;box-shadow:0 8px 18px rgba(0,0,0,.14);touch-action:none}.btn:active{transform:scale(.97)}.actionArea{display:flex;flex-direction:column;gap:10px}.action{width:78px;height:78px;border-radius:50%}.crosshair{position:fixed;left:50%;top:50%;width:24px;height:24px;margin-left:-12px;margin-top:-12px;z-index:18;pointer-events:none}.crosshair::before,.crosshair::after{content:"";position:absolute;background:rgba(0,0,0,.85);border-radius:2px}.crosshair::before{width:24px;height:2px;top:11px;left:0}.crosshair::after{width:2px;height:24px;left:11px;top:0}.clear{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);z-index:40;color:#fff;font-size:48px;font-weight:900;text-shadow:0 0 20px rgba(0,0,0,.7);display:none;text-align:center}.notice{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:19;background:rgba(0,0,0,.36);color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;backdrop-filter:blur(5px)}body.auto .dpad{display:none}body.auto .ui{justify-content:flex-end}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="tapLayer"></div>
<div class="mode"><button id="modeBtn">MANUAL</button></div><div class="system"><button id="resetBtn">リセット</button><button id="respawnBtn">リスポーン</button></div>
<div class="hud"><div id="timeText">T:0.00</div><div id="heightText">H:0</div><div id="speedText">S:0</div><div id="wireText">L:OFF / R:OFF</div><div id="stateText">GROUND</div></div>
<div class="crosshair"></div><div class="notice">左半分タップ=左ワイヤー / 右半分タップ=右ワイヤー</div><div id="clearText" class="clear">CLEAR!!<br><span id="rankText" style="font-size:28px"></span></div>
<div class="ui"><div class="dpad"><div></div><button class="btn" id="up">↑</button><div></div><button class="btn" id="left">←</button><div></div><button class="btn" id="right">→</button><div></div><button class="btn" id="down">↓</button><div></div></div><div class="actionArea"><button class="btn action" id="reel">A</button><button class="btn action" id="release">B</button></div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const canvas=document.getElementById('game');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ed0ff);scene.fog=new THREE.Fog(0xbfe6ff,1200,4800);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,9000);const clock=new THREE.Clock();
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7a55,1.2));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(900,1600,700);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=50;sun.shadow.camera.far=5000;sun.shadow.camera.left=-2200;sun.shadow.camera.right=2200;sun.shadow.camera.top=2200;sun.shadow.camera.bottom=-2200;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(12000,12000),new THREE.MeshStandardMaterial({color:0x74a85d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x918777,roughness:.95});for(let i=-5;i<=5;i++){let a=new THREE.Mesh(new THREE.BoxGeometry(12000,2,90),roadMat);a.position.set(0,1,i*760);a.receiveShadow=true;scene.add(a);let b=new THREE.Mesh(new THREE.BoxGeometry(90,2,12000),roadMat);b.position.set(i*760,1,0);b.receiveShadow=true;scene.add(b)}
const buildings=[],solids=[];const palettes=[{wall:0xb56d58,roof:0x6f3028,trim:0x7d463a},{wall:0xd5b58e,roof:0x8b4337,trim:0x725039},{wall:0xc7b6a4,roof:0x62584f,trim:0x86766a},{wall:0xdcc9aa,roof:0x5f332b,trim:0x61432f}];
function createBuilding(x,z,w,d,h,pal){const g=new THREE.Group();g.position.set(x,h/2,z);const wallMat=new THREE.MeshStandardMaterial({color:pal.wall,roughness:.85}),roofMat=new THREE.MeshStandardMaterial({color:pal.roof,roughness:.8}),trimMat=new THREE.MeshStandardMaterial({color:pal.trim,roughness:.9}),winMat=new THREE.MeshStandardMaterial({color:0xdcecf8,roughness:.25,metalness:.05});const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);body.castShadow=body.receiveShadow=true;g.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(w*1.08,18,d*1.08),roofMat);roof.position.y=h/2+9;roof.castShadow=roof.receiveShadow=true;g.add(roof);for(let y=-h/2+70;y<h/2-20;y+=90){const band=new THREE.Mesh(new THREE.BoxGeometry(w*1.03,6,d*1.04),trimMat);band.position.y=y;g.add(band)}const rows=Math.max(1,Math.floor(h/90)),colsF=Math.max(1,Math.floor(w/55)),colsS=Math.max(1,Math.floor(d/55));for(let r=0;r<rows;r++){const yy=-h/2+55+r*80;for(let c=0;c<colsF;c++){const xx=-w/2+(c+1)*w/(colsF+1);const f=new THREE.Mesh(new THREE.BoxGeometry(18,30,3),winMat);f.position.set(xx,yy,d/2+2);g.add(f);const bk=f.clone();bk.position.z=-d/2-2;g.add(bk)}for(let c=0;c<colsS;c++){const zz=-d/2+(c+1)*d/(colsS+1);const rgt=new THREE.Mesh(new THREE.BoxGeometry(3,30,18),winMat);rgt.position.set(w/2+2,yy,zz);g.add(rgt);const l=rgt.clone();l.position.x=-w/2-2;g.add(l)}}scene.add(g);buildings.push(g);solids.push({x:x-w/2,z:z-d/2,w,d,h})}
for(let gx=-5;gx<=5;gx++){for(let gz=-5;gz<=5;gz++){if(gx===0&&gz===0)continue;if(gx===1&&gz===1)continue;if(Math.abs(gx)%3===0||Math.abs(gz)%3===0)continue;if(Math.random()<.12)continue;const x=gx*760+(Math.random()*180-90),z=gz*760+(Math.random()*180-90),w=190+Math.random()*130,d=190+Math.random()*130,centerBoost=Math.max(0,1-Math.hypot(gx,gz)/7),h=220+Math.random()*360+centerBoost*420,pal=palettes[Math.floor(Math.random()*palettes.length)];createBuilding(x,z,w,d,h,pal)}}
const wallMat=new THREE.MeshStandardMaterial({color:0xbdb7ad,roughness:.9});const wallRadius=4700;for(let i=0;i<96;i++){const a=i/96*Math.PI*2,x=Math.sin(a)*wallRadius,z=Math.cos(a)*wallRadius;const wall=new THREE.Mesh(new THREE.BoxGeometry(230,820,120),wallMat);wall.position.set(x,410,z);wall.rotation.y=a;wall.castShadow=wall.receiveShadow=true;scene.add(wall);solids.push({x:x-115,z:z-60,w:230,d:120,h:820})}
const goalX=3100,goalZ=3250;const goal=new THREE.Group(),gateMat=new THREE.MeshStandardMaterial({color:0x35ff4a,emissive:0x0a4a0a,roughness:.4});const p1=new THREE.Mesh(new THREE.BoxGeometry(35,360,35),gateMat);p1.position.set(-100,180,0);const p2=p1.clone();p2.position.x=100;const top=new THREE.Mesh(new THREE.BoxGeometry(235,35,35),gateMat);top.position.set(0,360,0);goal.add(p1,p2,top);goal.position.set(goalX,0,goalZ);scene.add(goal);
const playerGroup=new THREE.Group();scene.add(playerGroup);const playerMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.8});const head=new THREE.Mesh(new THREE.SphereGeometry(22,16,12),playerMat);head.position.y=78;const torso=new THREE.Mesh(new THREE.CapsuleGeometry(12,48,8,12),playerMat);torso.position.y=42;playerGroup.add(head,torso);function limb(len,r=6){const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,10),playerMat);m.castShadow=true;return m}const limbs={lArm:limb(46,5),rArm:limb(46,5),lLeg:limb(54,6),rLeg:limb(54,6)};for(const k in limbs)playerGroup.add(limbs[k]);const leftLine=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x222222})),rightLine=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x111111}));scene.add(leftLine,rightLine);
const input={up:false,down:false,left:false,right:false,reel:false,release:false};let autoMode=false;const player={pos:new THREE.Vector3(0,60,0),vel:new THREE.Vector3(0,0,0),yaw:0,pitch:0,grounded:false,wires:{left:{hooked:false,point:new THREE.Vector3(),length:0},right:{hooked:false,point:new THREE.Vector3(),length:0}}};let startTime=performance.now(),clearTime=null,cleared=false;
function reset(){player.pos.set(0,80,0);player.vel.set(0,0,0);player.yaw=0;player.pitch=0;player.wires.left.hooked=false;player.wires.right.hooked=false;startTime=performance.now();clearTime=null;cleared=false;document.getElementById('clearText').style.display='none'}function respawn(){player.pos.set(0,360,0);player.vel.set(0,0,0);player.wires.left.hooked=false;player.wires.right.hooked=false}document.getElementById('resetBtn').onclick=reset;document.getElementById('respawnBtn').onclick=respawn;document.getElementById('modeBtn').onclick=()=>{autoMode=!autoMode;document.body.classList.toggle('auto',autoMode);document.getElementById('modeBtn').textContent=autoMode?'AUTO':'MANUAL'};
function bind(id,key){const el=document.getElementById(id),on=e=>{e.preventDefault();input[key]=true},off=e=>{e.preventDefault();input[key]=false};['pointerdown','touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,on,{passive:false}));['pointerup','pointercancel','touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,off,{passive:false}))}['up','down','left','right','reel','release'].forEach(v=>bind(v,v));
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')input.up=true;if(e.key==='ArrowDown')input.down=true;if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key.toLowerCase()==='a')input.reel=true;if(e.key.toLowerCase()==='b')input.release=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowUp')input.up=false;if(e.key==='ArrowDown')input.down=false;if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false;if(e.key.toLowerCase()==='a')input.reel=false;if(e.key.toLowerCase()==='b')input.release=false});
function forwardVector(){return new THREE.Vector3(Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),Math.cos(player.yaw)*Math.cos(player.pitch)).normalize()}
function shootWire(side,sx,sy){const ndc=new THREE.Vector2((sx/innerWidth)*2-1,-(sy/innerHeight)*2+1);const raycaster=new THREE.Raycaster();raycaster.setFromCamera(ndc,camera);raycaster.far=3200;const objects=[];scene.traverse(o=>{if(o.isMesh&&o!==ground&&o.parent!==playerGroup)objects.push(o)});const hits=raycaster.intersectObjects(objects,true);let hit=hits.find(h=>h.distance>70);if(!hit){const gh=raycaster.intersectObject(ground);hit=gh.find(h=>h.distance>70)}if(!hit)return;const f=forwardVector(),toHit=hit.point.clone().sub(player.pos).normalize();if(f.dot(toHit)<.06)return;const w=player.wires[side];w.hooked=true;w.point.copy(hit.point);w.length=player.pos.distanceTo(hit.point)}
document.getElementById('tapLayer').addEventListener('pointerdown',e=>{if(e.target.id!=='tapLayer')return;e.preventDefault();shootWire(e.clientX<innerWidth/2?'left':'right',e.clientX,e.clientY)},{passive:false});
function collide(){const radius=28;player.grounded=false;if(player.pos.y<60){player.pos.y=60;if(player.vel.y<0)player.vel.y=0;player.grounded=true}for(const b of solids){if(player.pos.y>b.h+80)continue;const insideX=player.pos.x>b.x-radius&&player.pos.x<b.x+b.w+radius,insideZ=player.pos.z>b.z-radius&&player.pos.z<b.z+b.d+radius;if(insideX&&insideZ&&player.pos.y<b.h+70){const left=Math.abs(player.pos.x-(b.x-radius)),right=Math.abs(player.pos.x-(b.x+b.w+radius)),front=Math.abs(player.pos.z-(b.z-radius)),back=Math.abs(player.pos.z-(b.z+b.d+radius)),min=Math.min(left,right,front,back);if(min===left){player.pos.x=b.x-radius;player.vel.x*=.25}else if(min===right){player.pos.x=b.x+b.w+radius;player.vel.x*=.25}else if(min===front){player.pos.z=b.z-radius;player.vel.z*=.25}else{player.pos.z=b.z+b.d+radius;player.vel.z*=.25}}if(player.pos.x>b.x-radius&&player.pos.x<b.x+b.w+radius&&player.pos.z>b.z-radius&&player.pos.z<b.z+b.d+radius&&player.pos.y<b.h+60&&player.pos.y>b.h-30&&player.vel.y<=0){player.pos.y=b.h+60;player.vel.y=0;player.grounded=true}}}
function applyWire(w,dt){if(!w.hooked)return;const toPlayer=player.pos.clone().sub(w.point),dist=toPlayer.length();if(dist<1)return;const n=toPlayer.clone().normalize();if(input.reel){w.length=Math.max(90,w.length-(8+Math.min(22,dist*.018)))}else{w.length=Math.min(w.length+.5,dist+26)}if(dist>w.length){const excess=dist-w.length;player.pos.addScaledVector(n,-excess);const radial=player.vel.dot(n);if(radial>0)player.vel.addScaledVector(n,-radial);if(input.reel){player.vel.addScaledVector(n,-(14+Math.min(30,excess*.08))*dt*60)}}}
function updateCamera(dt){if(autoMode){const dx=goalX-player.pos.x,dz=goalZ-player.pos.z,targetYaw=Math.atan2(dx,dz);let diff=targetYaw-player.yaw;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;player.yaw+=diff*.05;const dist=Math.hypot(dx,dz),targetPitch=THREE.MathUtils.clamp(Math.atan2(160-player.pos.y,dist)+.05,-.55,.55);player.pitch+=(targetPitch-player.pitch)*.04}else{if(input.left)player.yaw-=1.8*dt;if(input.right)player.yaw+=1.8*dt;if(input.up)player.pitch+=1.2*dt;if(input.down)player.pitch-=1.2*dt;player.pitch=THREE.MathUtils.clamp(player.pitch,-1.2,1.2)}const f=forwardVector(),target=player.pos.clone().add(new THREE.Vector3(0,40,0)),camPos=target.clone().addScaledVector(f,-230).add(new THREE.Vector3(0,80,0));camera.position.lerp(camPos,.22);camera.lookAt(target.clone().addScaledVector(f,180))}
function updateAvatar(){playerGroup.position.copy(player.pos);playerGroup.rotation.y=player.yaw;const reeling=input.reel&&(player.wires.left.hooked||player.wires.right.hooked),t=Math.sin(performance.now()*.01)*.12;limbs.lArm.position.set(-22,50,0);limbs.rArm.position.set(22,50,0);limbs.lLeg.position.set(-14,15,0);limbs.rLeg.position.set(14,15,0);if(reeling){limbs.lArm.rotation.set(1.2,0,.8);limbs.rArm.rotation.set(1.2,0,-.8);torso.rotation.x=.25}else if(!player.grounded&&player.vel.y<-1){limbs.lArm.rotation.set(.7,0,.6);limbs.rArm.rotation.set(.7,0,-.6);limbs.lLeg.rotation.set(.45,0,.25);limbs.rLeg.rotation.set(.35,0,-.25);torso.rotation.x=-.08}else{limbs.lArm.rotation.set(.25+t,0,.55);limbs.rArm.rotation.set(.25-t,0,-.55);limbs.lLeg.rotation.set(.12,0,.18);limbs.rLeg.rotation.set(.12,0,-.18);torso.rotation.x=0}}
function updateWireLines(){function setLine(line,w,offset){if(!w.hooked){line.visible=false;return}line.visible=true;line.geometry.dispose();line.geometry=new THREE.BufferGeometry().setFromPoints([player.pos.clone().add(offset),w.point])}setLine(leftLine,player.wires.left,new THREE.Vector3(-20,55,0));setLine(rightLine,player.wires.right,new THREE.Vector3(20,55,0))}
function getRank(sec){if(sec<=18)return'S';if(sec<=30)return'A';if(sec<=45)return'B';if(sec<=60)return'C';return'D'}function updateUI(){const elapsed=clearTime??(performance.now()-startTime)/1000;timeText.textContent='T:'+elapsed.toFixed(2);heightText.textContent='H:'+Math.floor(player.pos.y);speedText.textContent='S:'+Math.floor(player.vel.length()*10);wireText.textContent='L:'+(player.wires.left.hooked?'ON':'OFF')+' / R:'+(player.wires.right.hooked?'ON':'OFF');stateText.textContent=player.grounded?'GROUND':'AIR'}
function checkGoal(){if(cleared)return;const d=Math.hypot(player.pos.x-goalX,player.pos.z-goalZ);if(d<160&&player.pos.y<430){cleared=true;clearTime=(performance.now()-startTime)/1000;rankText.textContent='TIME '+clearTime.toFixed(2)+' / RANK '+getRank(clearTime);clearText.style.display='block'}}
function animate(){const dt=Math.min(.033,clock.getDelta());if(input.release){player.wires.left.hooked=false;player.wires.right.hooked=false}player.vel.y-=14*dt;applyWire(player.wires.left,dt);applyWire(player.wires.right,dt);player.pos.addScaledVector(player.vel,dt*60);collide();player.vel.multiplyScalar(.993);player.vel.y*=.998;updateCamera(dt);updateAvatar();updateWireLines();checkGoal();updateUI();renderer.render(scene,camera);requestAnimationFrame(animate)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();reset();animate();document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
